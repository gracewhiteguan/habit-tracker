<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Habit Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .date {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .habit-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .habit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .habit-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .hydration-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .hydration-grid input[type="checkbox"] {
            width: 100%;
            height: 40px;
        }

        .mood-input {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            cursor: pointer;
            accent-color: #667eea;
        }

        .mood-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            min-width: 40px;
            text-align: center;
        }

        textarea {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea::placeholder {
            color: #adb5bd;
        }

        .streak {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .streak-info {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }

        .streak-item {
            text-align: center;
        }

        .streak-number {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
        }

        .streak-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .checkmark {
            color: #28a745;
            font-size: 20px;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .toggle-btn {
            padding: 10px 24px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .toggle-btn:hover {
            background: #f8f9fa;
        }

        .toggle-btn.active {
            background: #667eea;
            color: white;
        }

        .view-container {
            display: none;
        }

        .view-container.active {
            display: block;
        }

        .summary-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .summary-btn {
            padding: 8px 16px;
            border: 2px solid #e9ecef;
            background: white;
            color: #495057;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .summary-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .summary-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .summary-grid {
            display: grid;
            gap: 15px;
        }

        .day-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #667eea;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .day-date {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .day-mood {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
        }

        .day-habits {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }

        .habit-badge {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }

        .habit-badge.completed {
            background: #d4edda;
            color: #155724;
        }

        .habit-badge.incomplete {
            background: #f8d7da;
            color: #721c24;
        }

        .day-notes {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 6px;
            font-size: 14px;
            color: #495057;
            font-style: italic;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .stats-summary {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        @media (min-width: 500px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Daily Habits</h1>
        <div class="date" id="currentDate"></div>

        <div class="view-toggle">
            <button class="toggle-btn active" onclick="switchView('today')">Today</button>
            <button class="toggle-btn" onclick="switchView('summary')">Summary</button>
        </div>

        <div id="todayView" class="view-container active">

        <div class="habit-item">
            <div class="habit-header">
                <span class="habit-name">💧 Hydration</span>
            </div>
            <div class="hydration-grid">
                <input type="checkbox" id="hydration1" onchange="saveHabits()">
                <input type="checkbox" id="hydration2" onchange="saveHabits()">
                <input type="checkbox" id="hydration3" onchange="saveHabits()">
                <input type="checkbox" id="hydration4" onchange="saveHabits()">
                <input type="checkbox" id="hydration5" onchange="saveHabits()">
                <input type="checkbox" id="hydration6" onchange="saveHabits()">
            </div>
        </div>

        <div class="habit-item">
            <div class="habit-header">
                <span class="habit-name">💪 Workout</span>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="workout" onchange="saveHabits()">
                </div>
            </div>
        </div>

        <div class="habit-item">
            <div class="habit-header">
                <span class="habit-name">🦷 Flossing</span>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="flossing" onchange="saveHabits()">
                </div>
            </div>
        </div>

        <div class="habit-item">
            <div class="habit-header">
                <span class="habit-name">📚 Reading</span>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="reading" onchange="saveHabits()">
                </div>
            </div>
        </div>

        <div class="habit-item">
            <div class="habit-header">
                <span class="habit-name">🧘 Stretch</span>
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="stretch" onchange="saveHabits()">
                </div>
            </div>
        </div>

        <div class="habit-item">
            <div class="habit-header">
                <span class="habit-name">😊 Mood</span>
            </div>
            <div class="mood-input">
                <input type="range" id="mood" min="1" max="10" value="5" oninput="updateMoodValue(); saveHabits()">
                <span class="mood-value" id="moodValue">5</span>
            </div>
            <textarea id="notes" placeholder="Optional notes about your day..." oninput="saveHabits()"></textarea>
        </div>

        <div class="streak">
            <div class="streak-info">
                <div class="streak-item">
                    <div class="streak-number" id="workoutStreak">0</div>
                    <div class="streak-label">Workout</div>
                </div>
                <div class="streak-item">
                    <div class="streak-number" id="readingStreak">0</div>
                    <div class="streak-label">Reading</div>
                </div>
                <div class="streak-item">
                    <div class="streak-number" id="stretchStreak">0</div>
                    <div class="streak-label">Stretch</div>
                </div>
                <div class="streak-item">
                    <div class="streak-number" id="flossingStreak">0</div>
                    <div class="streak-label">Flossing</div>
                </div>
            </div>
        </div>
        </div>

        <div id="summaryView" class="view-container">
            <div class="summary-controls">
                <button class="summary-btn active" onclick="loadSummary('week')">This Week</button>
                <button class="summary-btn" onclick="loadSummary('month')">This Month</button>
                <button class="summary-btn" onclick="loadSummary('all')">All Time</button>
            </div>
            
            <div id="summaryStats" class="stats-summary"></div>
            <div id="summaryContent" class="summary-grid"></div>
        </div>
    </div>

    <script>
        function getTodayKey() {
            const today = new Date();
            return today.toISOString().split('T')[0];
        }

        function updateDate() {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = today.toLocaleDateString('en-US', options);
        }

        function updateMoodValue() {
            const moodValue = document.getElementById('mood').value;
            document.getElementById('moodValue').textContent = moodValue;
        }

        function saveHabits() {
            const todayKey = getTodayKey();
            const data = {
                hydration1: document.getElementById('hydration1').checked,
                hydration2: document.getElementById('hydration2').checked,
                hydration3: document.getElementById('hydration3').checked,
                hydration4: document.getElementById('hydration4').checked,
                hydration5: document.getElementById('hydration5').checked,
                hydration6: document.getElementById('hydration6').checked,
                workout: document.getElementById('workout').checked,
                flossing: document.getElementById('flossing').checked,
                reading: document.getElementById('reading').checked,
                stretch: document.getElementById('stretch').checked,
                mood: parseInt(document.getElementById('mood').value),
                notes: document.getElementById('notes').value
            };
            
            localStorage.setItem(todayKey, JSON.stringify(data));
            updateStreaks();
        }

        function loadHabits() {
            const todayKey = getTodayKey();
            const savedData = localStorage.getItem(todayKey);
            
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('hydration1').checked = data.hydration1 || false;
                document.getElementById('hydration2').checked = data.hydration2 || false;
                document.getElementById('hydration3').checked = data.hydration3 || false;
                document.getElementById('hydration4').checked = data.hydration4 || false;
                document.getElementById('hydration5').checked = data.hydration5 || false;
                document.getElementById('hydration6').checked = data.hydration6 || false;
                document.getElementById('workout').checked = data.workout || false;
                document.getElementById('flossing').checked = data.flossing || false;
                document.getElementById('reading').checked = data.reading || false;
                document.getElementById('stretch').checked = data.stretch || false;
                document.getElementById('mood').value = data.mood || 5;
                document.getElementById('notes').value = data.notes || '';
                updateMoodValue();
            }
        }

        function calculateStreak(habitName) {
            let streak = 0;
            const today = new Date();
            
            for (let i = 0; i < 365; i++) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const key = date.toISOString().split('T')[0];
                const data = localStorage.getItem(key);
                
                if (data) {
                    const habits = JSON.parse(data);
                    if (habits[habitName]) {
                        streak++;
                    } else {
                        break;
                    }
                } else {
                    break;
                }
            }
            
            return streak;
        }

        function updateStreaks() {
            document.getElementById('workoutStreak').textContent = calculateStreak('workout');
            document.getElementById('readingStreak').textContent = calculateStreak('reading');
            document.getElementById('stretchStreak').textContent = calculateStreak('stretch');
            document.getElementById('flossingStreak').textContent = calculateStreak('flossing');
        }

        function switchView(view) {
            // Update button states
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update views
            document.getElementById('todayView').classList.remove('active');
            document.getElementById('summaryView').classList.remove('active');

            if (view === 'today') {
                document.getElementById('todayView').classList.add('active');
            } else {
                document.getElementById('summaryView').classList.add('active');
                loadSummary('week');
            }
        }

        function loadSummary(period) {
            // Update button states
            document.querySelectorAll('.summary-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            const today = new Date();
            let daysToShow = 7;
            
            if (period === 'month') {
                daysToShow = 30;
            } else if (period === 'all') {
                daysToShow = 365;
            }

            const entries = [];
            for (let i = 0; i < daysToShow; i++) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const key = date.toISOString().split('T')[0];
                const data = localStorage.getItem(key);
                
                if (data) {
                    const parsed = JSON.parse(data);
                    entries.push({
                        date: date,
                        key: key,
                        ...parsed
                    });
                }
            }

            renderSummary(entries, period);
        }

        function renderSummary(entries, period) {
            const summaryContent = document.getElementById('summaryContent');
            const summaryStats = document.getElementById('summaryStats');

            if (entries.length === 0) {
                summaryContent.innerHTML = '<div class="empty-state">No data yet. Start tracking your habits!</div>';
                summaryStats.innerHTML = '';
                return;
            }

            // Calculate stats
            const workoutCount = entries.filter(e => e.workout).length;
            const readingCount = entries.filter(e => e.reading).length;
            const stretchCount = entries.filter(e => e.stretch).length;
            const flossingCount = entries.filter(e => e.flossing).length;
            const avgMood = (entries.reduce((sum, e) => sum + e.mood, 0) / entries.length).toFixed(1);
            const totalDays = entries.length;

            // Calculate average hydration
            const totalHydration = entries.reduce((sum, e) => {
                let count = 0;
                for (let i = 1; i <= 6; i++) {
                    if (e[`hydration${i}`]) count++;
                }
                return sum + count;
            }, 0);
            const avgHydration = (totalHydration / entries.length).toFixed(1);

            // Render stats
            summaryStats.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value">${avgHydration}/6</div>
                        <div class="stat-label">Avg Water</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${workoutCount}/${totalDays}</div>
                        <div class="stat-label">Workouts</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${stretchCount}/${totalDays}</div>
                        <div class="stat-label">Stretch</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${avgMood}</div>
                        <div class="stat-label">Avg Mood</div>
                    </div>
                </div>
            `;

            // Render entries
            summaryContent.innerHTML = entries.map(entry => {
                const dateStr = entry.date.toLocaleDateString('en-US', { 
                    weekday: 'short', 
                    month: 'short', 
                    day: 'numeric' 
                });

                // Count hydration
                let hydrationCount = 0;
                for (let i = 1; i <= 6; i++) {
                    if (entry[`hydration${i}`]) hydrationCount++;
                }

                return `
                    <div class="day-card">
                        <div class="day-header">
                            <span class="day-date">${dateStr}</span>
                            <span class="day-mood">${entry.mood}/10</span>
                        </div>
                        <div class="day-habits">
                            <span class="habit-badge ${hydrationCount >= 4 ? 'completed' : 'incomplete'}">
                                💧 ${hydrationCount}/6
                            </span>
                            <span class="habit-badge ${entry.workout ? 'completed' : 'incomplete'}">
                                ${entry.workout ? '✓' : '✗'} Workout
                            </span>
                            <span class="habit-badge ${entry.flossing ? 'completed' : 'incomplete'}">
                                ${entry.flossing ? '✓' : '✗'} Floss
                            </span>
                            <span class="habit-badge ${entry.reading ? 'completed' : 'incomplete'}">
                                ${entry.reading ? '✓' : '✗'} Reading
                            </span>
                            <span class="habit-badge ${entry.stretch ? 'completed' : 'incomplete'}">
                                ${entry.stretch ? '✓' : '✗'} Stretch
                            </span>
                        </div>
                        ${entry.notes ? `<div class="day-notes">${entry.notes}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        // Initialize
        updateDate();
        loadHabits();
        updateStreaks();
    </script>
</body>
</html>
